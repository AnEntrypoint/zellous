name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify vendored nostr-tools bundle
        run: cd docs/vendor/nostr-tools && sha256sum -c SHA256SUMS
      - name: Parse-check first-party JS
        run: |
          node -e "
          const {execSync}=require('child_process');
          const fs=require('fs'),p=require('path');
          function walk(d,a=[]){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.name.startsWith('.')||e.name==='vendor')continue;const fp=p.join(d,e.name);e.isDirectory()?walk(fp,a):/\.(m?js)\$/.test(e.name)&&a.push(fp);}return a;}
          const targets=[...walk('docs/js'),...(fs.existsSync('site')?walk('site'):[]),'flatspace.config.mjs'].filter(fs.existsSync);
          const fails=[];for(const f of targets){try{execSync('node --check \"'+f+'\"',{stdio:'pipe'});}catch(e){fails.push(f+': '+String(e.stderr).split('\n')[0]);}}
          if(fails.length){console.error(fails.join('\n'));process.exit(1);}
          console.log('parse OK ('+targets.length+' files)');
          "
      - name: Static-serve smoke
        run: |
          node -e "
          const http=require('http'),fs=require('fs'),p=require('path'),url=require('url');
          const ROOT=p.resolve('docs');
          const MIME={'.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.html':'text/html'};
          const server=http.createServer((q,s)=>{
            let f=p.normalize(p.join(ROOT,decodeURIComponent(url.parse(q.url).pathname)));
            if(!f.startsWith(ROOT))return s.writeHead(403).end();
            if(fs.existsSync(f)&&fs.statSync(f).isDirectory())f=p.join(f,'index.html');
            if(!fs.existsSync(f))return s.writeHead(404).end('404');
            const ext=p.extname(f);
            s.writeHead(200,MIME[ext]?{'Content-Type':MIME[ext]}:{});
            s.end(fs.readFileSync(f));
          }).listen(5175,()=>{
            http.get('http://127.0.0.1:5175/nostr-chat/',(res)=>{
              let body='';res.on('data',c=>body+=c);res.on('end',()=>{
                if(res.statusCode!==200||!/<!doctype html/i.test(body)){console.error('smoke failed',res.statusCode);process.exit(1);}
                console.log('static-serve smoke OK');server.close();
              });
            }).on('error',(e)=>{console.error(e);process.exit(1);});
          });
          "

  browser-witness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@^1.59.1
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Boot app and witness appReady
        run: |
          node -e "
          const http=require('http'),fs=require('fs'),p=require('path'),url=require('url');
          const {chromium}=require('playwright');
          const ROOT=p.resolve('docs');
          const MIME={'.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.html':'text/html'};
          http.createServer((q,s)=>{
            let f=p.normalize(p.join(ROOT,decodeURIComponent(url.parse(q.url).pathname)));
            if(!f.startsWith(ROOT))return s.writeHead(403).end();
            if(fs.existsSync(f)&&fs.statSync(f).isDirectory())f=p.join(f,'index.html');
            if(!fs.existsSync(f))return s.writeHead(404).end('404');
            const ext=p.extname(f);
            s.writeHead(200,MIME[ext]?{'Content-Type':MIME[ext]}:{});
            s.end(fs.readFileSync(f));
          }).listen(5175, async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => m.type() === 'error' && errors.push(m.text()));
            await page.goto('http://127.0.0.1:5175/nostr-chat/', { waitUntil: 'networkidle' });
            try {
              await page.waitForFunction('window.appReady===true', { timeout: 20000 });
            } catch (e) {
              console.error('appReady never became true');
              process.exit(1);
            }
            const real = errors.filter(e => !/fonts\.googleapis/.test(e));
            if (real.length) { console.error('console errors:', real); process.exit(1); }
            console.log('browser-witness OK: appReady=true, zero console errors');
            await browser.close();
            process.exit(0);
          });
          "
