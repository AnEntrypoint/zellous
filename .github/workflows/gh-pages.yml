name: Deploy GH Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build with flatspace
        run: npx --yes flatspace@latest build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default 10min timeout is right at the edge of this repo's observed
          # normal deploy latency (up to ~11.5min for legitimate successes,
          # per AGENTS.md); repeated false-timeout failures this session were
          # actions/deploy-pages@v5's own polling loop giving up on a
          # deployment_in_progress/deployment_queued status that was still
          # genuinely converging, not stuck. Widened, not removed — a truly
          # stuck deployment still gets cancelled eventually.
          timeout: 900000
