- id: fix-message-deletion-never-propagates
  subject: Fix message deletion never propagating to other clients (no kind:5 subscription existed anywhere)
  description: During the security re-audit of Nostr event validation, found deleteMessage() correctly publishes a NIP-09 kind:5 deletion event and optimistically removes the message from the DELETING user's own local view, but no code anywhere (grep across all wireweave src files) ever subscribes to kind:5 events -- so the message never actually disappears for anyone else. Fixed by adding a chat-deletions-<channelId> subscription in loadHistory() that receives kind:5 events and removes the referenced message locally, but ONLY if the deletion event's pubkey matches the original message's author or the current user is a server admin (mirroring the exact authorization pattern already proven correct in roles.js/bans.js/settings.js/pages.js), preventing a malicious actor from forging deletions of other people's messages.
  witness: 'Fixed in commit 14fe3ff, pushed, CI green. Verified live on production: curl of the deployed chat.js confirms the chat-deletions subscription is present.'
  status: completed
- id: fix-bans-never-enforced-in-chat
  subject: Fix bans/timeouts only ever enforced in voice, never in text chat
  description: 'Found during a broader moderation-enforcement audit: bans.isBanned()/isTimedOut() were only consulted by voice.js. chat.js had zero awareness of the bans store -- a banned/timed-out user could send text messages freely, and messages from a banned author were never filtered from other users'' views either. Wired bans into createChat() (docs/vendor/wireweave/src/wireweave.js) and added enforcement in send() (rejects with a send-blocked event -> real toast) and both message-receive subscriptions (filter banned/timed-out authors before they reach the message list).'
  witness: 'Fixed in commit c6edc4f/18c87e2, deployed and verified live on production: simulated self-ban correctly blocks sending with the right toast, normal sending unaffected. CI green.'
  status: completed
