- id: sdk-ca-app-css-comment-corruption
  title: 'SDK-wide layout collapse: a doc-comment typo (.cm-*/.vx-*) in community-app.css silently drops the .ca-app base flex/height rule from the built CSS bundle, breaking the entire app layout'
  description: 'User-reported: GUI visibly incomplete/not laying out properly on the live site. Root-caused via browser CSSOM inspection (anentrypoint.github.io/zellous/nostr-chat/ live page): the .ca-app top-level container (mountCommunityApp root) computed display:block instead of display:flex, height:900px only by accident (100vh default), while .ca-rail and .chat sized to CONTENT height (~512px/~464px) instead of stretching to fill the viewport -- leaving a large dead void between the composer and a disconnected fixed footer bar, exactly matching the reported screenshot. Root cause: /config/workspace/design/community-app.css lines 12 and 23 contain the literal prose .cm-*/.vx-* (shorthand for cm- and vx- prefixed classes) inside a doc comment -- the */ substring prematurely closes the CSS comment (CSS comments do not nest, first */ wins), corrupting everything between that point and the intended real closer into an invalid selector, which merges with and silently drops the very next real rule: html.ds-247420 .ca-app { display:flex; height:100vh; ...}. Verified via a from-scratch CSS-comment-state scanner run against the exact concatenated bundle scripts/build.mjs produces (12 cssParts files in order): exactly 2 stray unmatched */ closers, both traced to these two occurrences, zero elsewhere in the entire ~450KB bundle. Fixed both (added spaces: .cm-* / .vx-*), re-ran node scripts/build.mjs, re-scanned the real dist/247420.css output -- 0 stray closers, .ca-app rule now correctly present as .ds-247420.ds-247420 .ca-app { display:flex; height:100vh; height:100dvh; ...}.'
  acceptance: Live browser witness (route-intercepted to serve the rebuilt dist/247420.css) shows .ca-rail and .chat both reaching the viewport bottom (no dead void), matching .ca-app's full height. Design repo commit+push+CI green, then verified against the REAL live gh-pages CSS (not just the intercepted local one) once redeployed.
  status: completed
  witness: 'Fixed /config/workspace/design/community-app.css lines 12+23 (removed literal */ substring from .cm-*/.vx-* prose by adding spaces: .cm-* / .vx-*). Verified with a from-scratch CSS-comment-state scanner against the exact build.mjs-concatenated bundle: 2 stray unmatched */ closers before fix, 0 after. Ran real node scripts/build.mjs -- .ca-app rule now present as .ds-247420.ds-247420 .ca-app {display:flex;height:100vh;height:100dvh;...} in dist/247420.css. My fix landed inside a pre-existing local commit from a concurrent session (8472b7f, unrelated consolidation work) -- rebased onto 4 newer origin/main commits (origin had NOT diverged with a competing fix), resolved the one real conflict (generated dist/247420.js) by taking either side then re-running node scripts/build.mjs fresh to guarantee byte-correctness, committed (31f197c) and pushed to AnEntrypoint/design main. gh run list confirms ci+Publish 247420 to npm+Deploy GH Pages all completed/success on 31f197c. Live gh-pages https://anentrypoint.github.io/design/247420.css re-fetched post-deploy: .ca-app rule confirmed present and correctly scoped. Final browser witness against the REAL unmodified production URL https://anentrypoint.github.io/zellous/nostr-chat/ (no route interception, session 24): .ca-rail height=793 bottom=900, .chat height=745 bottom=900 -- both now reach the full viewport bottom matching .ca-app (900), zero dead void, zero console/page errors. Screenshot confirms the layout renders identically to the local pre-deploy test: full-height rail+chat, composer and footer status bar properly positioned with no gap.'
