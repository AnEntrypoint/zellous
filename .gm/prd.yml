- id: fix-voice-participants-never-render
  subject: Fix voice grid showing zero participant tiles, including yourself, since the SDK migration
  description: 'User reported voice worked before the redesign but has been broken since. Root cause found: wireweave-bridge.js''s ''connected'' event handler never seeded state.voiceParticipants, and the ''participants'' CustomEvent that would otherwise populate it only fires on remote peer list changes -- for a self-only join (the common case with no other peers yet) the signal stayed permanently empty, so the SDK''s voice grid (which correctly maps voiceParticipants into VoiceUser tiles) had nothing to render. Also fixed a field-name mismatch: the SDK''s VoiceUser component reads {identity, speaking, color} but the raw wireweave participant shape provides {isSpeaking, isMuted, ...} with no color -- adapter now maps isSpeaking->speaking and assigns a stable avatar color per identity.'
