- id: fix-browser-verb-chrome-sandbox-2026-07-25
  subject: 'Root-cause and fix the gm browser verb''s chromium-launch failure (cross-repo: AnEntrypoint/agentplug)'
  description: 'Per explicit user direction, cloned the actual source repos (gm at /config/workspace/gm, its agentplug submodule) instead of continuing to guess from a compiled binary. Found the real bug in agentplug/crates/agentplug-host/src/browser.rs''s launch_chrome(): it never passed --no-sandbox and redirected Chrome''s stdout/stderr to Stdio::null(), so in this container (no CAP_SYS_ADMIN / working user-namespace sandbox) Chrome printed ''No usable sandbox!'' and exited immediately -- completely invisible since nothing captured it, producing an opaque 30s CDP-timeout with zero diagnostic trace. Fixed by capturing Chrome''s output to a real log file and auto-retrying once with --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage when the log shows a sandbox denial.'
  witness: 'Fixed at the source: AnEntrypoint/agentplug commit 124fadf (launch_chrome now captures Chrome''s stdout/stderr and auto-retries with --no-sandbox on a detected sandbox-denial), released as agentplug-bin v0.1.0, gm submodule pointer bumped in commit 415a0723. Verified three independent ways: (1) local dev build against the live zellous site, (2) the freshly-downloaded official release asset (not a cached/stale copy) against the live zellous site, (3) the real gm spool dispatch mechanism in this exact session (browser-2.json: ok:true, appReady:true, sdkKeys:248, duration_ms:1330 -- fast, reusing the warm session). Documented in AGENTS.md replacing the prior turn''s stale ''unfixable external blocker'' conclusion.'
  status: completed
