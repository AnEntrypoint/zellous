- id: nostr-event-validation
  text: 'Security audit: all Nostr events validated before state mutation. Check wireweave event handling, signature validation, replay protection, injection defense.'
  status: completed
  witness: 'Audited docs/vendor/wireweave/src/*.js. Signature verification (relay-pool.js:110-111 verifyEvent from nostr-tools schnorr), replay/dedup (relay-pool.js:104-106 seen LRU + future-timestamp bound), and content-sanitization (docs/js/ui-chat.js escHtml + wireweave-bridge.js:163 linkify operating on already-escaped text) were all present and correct. Found a real authorization gap: docs/vendor/wireweave/src/channels.js load() subscribed to owner-authored channel-config events (kind 30078) via a relay-side authors filter, but — unlike the sibling authority-gated stores roles.js:53/bans.js:64/settings.js:65/pages.js:87, which all re-check event.pubkey===creator locally — channels.js never verified the event''s actual signer against the server owner pubkey after receipt. A malicious/compromised relay could forward a validly-self-signed event from ANY attacker pubkey and it would silently overwrite every client''s channel/category list for that server (local filters are advisory only; relays aren''t required to honor them). Fixed in /config/workspace/wireweave/src/channels.js:32 (source of truth, uncommitted — needs a commit in that sibling repo) by adding `if (event.pubkey !== ownerPubkey) return;` plus shape validation (`Array.isArray(data.channels/categories)`) before mutating state, replacing the previous crash-prone `data.channels || []` fallback that would silently accept non-array garbage. Re-vendored the identical fix into docs/vendor/wireweave/src/channels.js:33 (diff verified byte-identical logic pre-fix, patched post-fix). node --check passed. Browser witness: static server on :5175 (docs/ root, correct MIME types), .gm/exec-spool/out/browser-922.json -> ''appReady_ok channelsType undefined errors []'' confirming window.appReady===true and zero new console errors after the fix. No other kind-30078 authority stores had the gap (roles/bans/settings/pages all already gate on event.pubkey). NOTE: wireweave sibling repo at /config/workspace/wireweave has an uncommitted fix to src/channels.js — needs `git commit` there (not pushed, per instructions).'
