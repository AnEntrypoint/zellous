- id: relaypool-disconnect-cancels-reconnect
  title: relay-pool disconnect() must cancel in-flight reconnect timers
  detail: 'onclose schedules setTimeout(_open,delay); disconnect() clears relays map but the pending timer still fires and resurrects the relay after an intended teardown. Add a _closed flag + track timer ids; disconnect() sets _closed and clears all timers; _open early-returns when _closed; connect()/heal() reset _closed. Witness: wireweave test asserting no reconnect after disconnect.'
  witness: 'src/relay-pool.js: _closed flag + _reconnectTimers Map; disconnect() sets _closed, clears timers; _open/onclose early-return on _closed. test.js testRelayReconnectCancel asserts timers cleared + no resurrect after disconnect; node test.js -> ''relay reconnect-cancel: pass'''
  status: completed
- id: relaypool-reconnect-jitter
  title: relay-pool add jitter to reconnect backoff
  detail: 'All relays that drop together reconnect in lockstep (thundering herd) since delay is deterministic doubling. Add +-25% random jitter to reconnectDelay before setTimeout so reconnects spread out. Witness: code review + test that delay falls in jittered band.'
  witness: 'src/relay-pool.js: jitter(ms)=round(ms*(0.75+rand*0.5)) applied at onclose setTimeout(_open, jitter(reconnectDelay)). Spreads lockstep reconnects +-25%. node test.js all pass (reconnect-cancel covers timer path)'
  status: completed
- id: relaypool-pending-cap-ttl
  title: relay-pool cap+TTL the offline publish queue
  detail: 'publish() pushes to this.pending unbounded when no relay connected; an offline tab grows pending forever and replays stale events on reconnect. Cap pending to a max (e.g. 500) dropping oldest, and stamp each with ts dropping entries older than a TTL (e.g. 120s) at drain. Witness: test that >cap publishes keep only newest cap and old entries are dropped.'
  witness: 'src/relay-pool.js: publish() pushes {event,ts}, splices to PENDING_MAX=500 oldest-dropped; _drainPending() drops entries older than PENDING_TTL_MS=120000. test.js testRelayPendingCapTtl asserts cap=500, oldest dropped, stale dropped -> ''relay pending cap/TTL: pass'''
  status: completed
