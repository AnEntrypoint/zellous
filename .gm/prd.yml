- id: esm-sh-resilience
  task: Evaluate whether wireweave's esm.sh CDN-only consumption (no re-vendor) has a resilience gap (SRI/integrity check, fallback CDN) discovered via research fanout
  status: completed
  witness: 'Evaluated wireweave/SDK esm.sh CDN-only consumption for SRI/fallback resilience gaps. Findings: (1) Import maps have no native SRI support in the web platform -- the integrity attribute only applies to real <script>/<link> tags, not importmap-resolved dynamic import() calls, so SRI on the wireweave/nostr-tools/anentrypoint-design importmap entries is not technically possible. (2) wireweave is already exact-version-pinned (not caret) per AGENTS.md''s documented reasoning -- this achieves SRI''s actual goal (immutable, auditable content per pinned version) without needing the unavailable integrity mechanism, since an exact esm.sh URL always resolves to the same immutable build. (3) The anentrypoint-design SDK stylesheet link CAN carry SRI (it is a real <link> tag) but per AGENTS.md the entire point of that live-CDN consumption model is auto-tracking the SDK''s latest gh-pages deploy without a re-vendor/pin step -- adding a content hash would break on every legitimate SDK update, directly fighting the intended architecture. Not applied; would be a self-inflicted outage generator. (4) The one genuine, actionable gap: single point of failure if esm.sh itself is unreachable, with no fallback CDN. Verified cdn.jsdelivr.net/npm/wireweave@0.3.60/+esm as a real working alternate mirror (curl HTTP 200), but wireweave-bridge.js already has a clear boot-error message on import failure (per AGENTS.md''s prior fix) rather than a silent hang -- judged the existing single-CDN-with-clear-error-message behavior as the correct tradeoff for this app''s complexity budget; a full failover-retry-second-CDN mechanism was considered and rejected as disproportionate complexity for a rare failure mode already surfaced honestly to the user via the boot overlay.'
