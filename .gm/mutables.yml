- id: themetoggle-compact-stale-closure-bug
  status: resolved
  text: anentrypoint-design's ThemeToggle({compact:true}) captures `current` (getTheme() result) once at render time; its onclick computes next relative to that stale captured value forever, so repeated clicks without a surrounding re-render stick after the first click (auto->paper->paper->paper instead of cycling). Worked around in zellous by wrapping the whole App render in a render() function and subscribing onThemeChange(render) so Hero() (and thus ThemeToggle()) re-executes on every theme change, refreshing the closure. Real fix belongs in theme-toggle.js itself (e.g. read getTheme() fresh inside the onclick handler instead of closing over the outer const), out of this repo's scope.
  witness: 'browser-12 (pre-fix): afterClick1=paper,afterClick2=paper,afterClick3=paper (stuck). browser-13 (post onThemeChange+render() fix): afterClick1=ink,afterClick2=auto,afterClick3=paper (correct cycle).'
