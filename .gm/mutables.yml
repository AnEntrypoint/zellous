  status: witnessed
  witness: .gm/exec-spool/.status.json ts stayed frozen at 1784898155170 across 5 consecutive 3s-spaced reads while the watcher process (pid 959828) was confirmed still running via ps. New instruction/git_commit dispatches wrote to in/ but their out/ files never appeared or were stale (mtime from an earlier successful run). bun x gm-plugkit@latest spool re-registration did not fix it (same stuck pid persisted). Recovery required manually kill()ing the stuck pid, then a fresh spool boot registered a new pid (1295895) which processed dispatches normally again. Real work (the ban-enforcement fix) was committed+pushed via a one-time direct git fallback while the watcher was stuck, per the standing rule that verified work must not sit uncommitted -- recorded here rather than silently repeated as a workaround.
